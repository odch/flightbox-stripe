name: Deploy to Firebase Functions on merge (dev)
'on':
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment:
          - lspl_test
          - lszm_test
          - lszo_test
          - lsze_test
    environment: ${{ matrix.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Install Google Cloud SDK components
        run: |
          sudo apt-get install google-cloud-cli

      - name: Configure Google Cloud Project
        run: |
          gcloud config set project ${{ vars.FIREBASE_PROJECT }}

      - name: Delete old cardPaymentsStripe (Gen 1)
        run: |
          gcloud functions delete cardPaymentsStripe --region=us-central1 --quiet || true

      - name: Deploy Firebase Function (Go)
        run: |
          gcloud functions deploy cardPaymentsStripe \
            --gen2 \
            --entry-point=CardPaymentsStripe \
            --trigger-event-filters="type=google.firebase.database.ref.v1.created" \
            --trigger-event-filters="instance=${{ vars.FIREBASE_RTDB_NAME }}" \
            --trigger-event-filters-path-pattern="ref=card-payments/{pushId}" \
            --trigger-location=europe-west1 \
            --region=europe-west1 \
            --runtime=go122 \
            --set-env-vars=STRIPE_SECRET=${{ secrets.STRIPE_SECRET }},\
          RETURN_BASE_URL=${{ vars.RETURN_BASE_URL }},\
          TERMINAL_ID=${{ vars.TERMINAL_ID }},\
          FIREBASE_DATABASE_URL=${{ vars.FIREBASE_RTDB_URL }}

      - name: Delete old StripeWebhook (Gen 1)
        run: |
          gcloud functions delete StripeWebhook --region=us-central1 --quiet || true

      - name: Deploy Webhook Firebase Function (Go)
        run: |
          gcloud functions deploy StripeWebhook \
            --gen2 \
            --allow-unauthenticated \
            --trigger-http \
            --region=europe-west1 \
            --runtime=go122 \
            --set-env-vars=WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }},\
          FIREBASE_DATABASE_URL=${{ vars.FIREBASE_RTDB_URL }}
